<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Menú Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'custom-primary': 'var(--primary-color, #eab308)',
            'dark-bg': '#121212',
            'dark-card': '#1a1a1a',
            'dark-border': '#2a2a2a',
            'dark-pill': '#1e1c18'
          }
        }
      }
    }
  </script>

  <style>
    :root { --primary-color: #eab308; }
    body { background-color: #121212; color: #e5e7eb; }
    .text-gold { color: var(--primary-color); }
    .bg-gold { background-color: var(--primary-color); }
  </style>
</head>
<body class="bg-dark-bg text-gray-200 font-sans pb-12">

  <!-- MODAL DE LOGIN -->
  <div id="modal-login" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-dark-card border border-dark-border w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="text-center space-y-1">
        <h2 class="font-bold text-xl text-white">🔐 Acceso al Panel</h2>
      </div>
      <div class="space-y-3 pt-2">
        <input type="text" id="login-user" placeholder="Usuario" class="w-full p-3 bg-dark-bg border border-dark-border rounded-xl text-sm text-white focus:outline-none">
        <input type="password" id="login-pass" placeholder="Contraseña" class="w-full p-3 bg-dark-bg border border-dark-border rounded-xl text-sm text-white focus:outline-none">
        <p id="login-error" class="text-xs text-red-400 font-semibold text-center hidden">Datos incorrectos.</p>
      </div>
      <button onclick="verificarLogin()" class="w-full py-3 bg-gold text-black font-extrabold rounded-xl text-sm">Ingresar</button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="bg-dark-card border-b border-dark-border sticky top-0 z-40">
    <div class="max-w-2xl mx-auto p-4 flex items-center justify-between">
      <h1 class="font-bold text-sm text-white flex items-center gap-2">⚙️ <span class="text-gold">Panel Admin</span></h1>
      <div class="flex items-center gap-2">
        <button onclick="cerrarSesion()" class="text-xs bg-dark-bg text-red-400 px-3 py-2 rounded-xl border border-dark-border">Cerrar Sesión</button>
        <a href="index.html" class="text-xs bg-dark-bg text-gray-300 px-3 py-2 rounded-xl border border-dark-border">Ver Menú ↗</a>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4 space-y-6">

    <!-- SECCIÓN NUEVA: SUBIR PROMO DEL DÍA / ESTADO DE 24 HS -->
    <section class="bg-dark-card p-5 rounded-2xl shadow-sm border border-amber-500/30 space-y-4">
      <h2 class="font-bold text-base text-amber-400 flex items-center justify-between border-b border-dark-border pb-2">
        <span>🔥 Subir Estado / Promo del Día (Dura 24 Horas)</span>
      </h2>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Imagen de la Promo / Banner</label>
          <input type="file" id="file-promo" accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-black cursor-pointer border border-dark-border rounded-xl p-1 bg-dark-bg">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Texto descriptivo de la Promo</label>
          <input type="text" id="promo-texto" placeholder="Ej: ¡2x1 en Pizzas Muzza solo por hoy!" class="w-full p-3 bg-dark-bg border border-dark-border rounded-xl text-sm text-white">
        </div>
        
        <!-- Estado de la promo actual -->
        <div id="promo-status-box" class="p-3 bg-dark-bg border border-dark-border rounded-xl hidden text-xs space-y-1">
          <p class="font-bold text-amber-400">✨ Promo Activa Actual:</p>
          <p id="promo-status-text" class="text-gray-300"></p>
          <p id="promo-status-timer" class="text-emerald-400 font-semibold"></p>
        </div>

        <button onclick="subirPromocion()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-rose-600 hover:opacity-90 text-black font-extrabold rounded-xl text-sm transition-all shadow-lg">
          🚀 Publicar Estado Promocional
        </button>
      </div>
    </section>

    <!-- SECCIÓN CONFIGURACIÓN -->
    <section class="bg-dark-card p-5 rounded-2xl shadow-sm border border-dark-border space-y-4">
      <h2 class="font-bold text-base text-white border-b border-dark-border pb-2">🏪 Configuración del Negocio</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Nombre del Local</label>
          <input type="text" id="cfg-nombre" class="w-full p-3 bg-dark-bg border border-dark-border rounded-xl text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Estado del Local</label>
          <select id="cfg-abierto" class="w-full p-3 bg-dark-bg border border-dark-border rounded-xl text-sm text-white">
            <option value="true">🟢 Abierto</option>
            <option value="false">🔴 Cerrado</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Costo Envío / Delivery ($)</label>
          <input type="number" id="cfg-delivery" class="w-full p-3 bg-dark-bg border border-dark-border rounded-xl text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">WhatsApp Pedidos</label>
          <input type="text" id="cfg-ws1" class="w-full p-3 bg-dark-bg border border-dark-border rounded-xl text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Alias Mercado Pago / CBU</label>
          <input type="text" id="cfg-alias" class="w-full p-3 bg-dark-bg border border-dark-border rounded-xl text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Titular de Cuenta</label>
          <input type="text" id="cfg-titular" class="w-full p-3 bg-dark-bg border border-dark-border rounded-xl text-sm text-white">
        </div>
        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-gray-300 mb-1">🖼️ Logo del Local</label>
          <input type="hidden" id="cfg-logo">
          <input type="file" id="file-logo" accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-dark-pill file:text-gold border border-dark-border rounded-xl p-1 bg-dark-bg">
        </div>
      </div>

      <button onclick="guardarConfiguracion()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm">
        💾 Guardar Configuración
      </button>
      <p id="cfg-msg" class="text-xs text-center font-semibold hidden"></p>
    </section>

    <!-- SECCIÓN PRODUCTOS -->
    <section class="bg-dark-card p-5 rounded-2xl shadow-sm border border-dark-border space-y-4">
      <h2 class="font-bold text-base text-white border-b border-dark-border pb-2"><span id="form-title" class="text-gold">🍔 Agregar Producto</span></h2>
      <input type="hidden" id="prod-id"><input type="hidden" id="prod-imagen">

      <div class="space-y-3">
        <input type="text" id="prod-nombre" placeholder="Nombre" class="w-full p-3 bg-dark-bg border border-dark-border rounded-xl text-sm text-white">
        <div class="grid grid-cols-2 gap-3">
          <input type="number" id="prod-precio" placeholder="Precio ($)" class="w-full p-3 bg-dark-bg border border-dark-border rounded-xl text-sm text-white">
          <input type="text" id="prod-categoria" placeholder="Categoría" class="w-full p-3 bg-dark-bg border border-dark-border rounded-xl text-sm text-white">
        </div>
        <textarea id="prod-descripcion" rows="2" placeholder="Descripción" class="w-full p-3 bg-dark-bg border border-dark-border rounded-xl text-sm text-white"></textarea>
        <input type="file" id="file-producto" accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-dark-pill file:text-gold border border-dark-border rounded-xl p-1 bg-dark-bg">
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="guardarProducto()" class="flex-1 py-3 bg-gold text-black font-extrabold rounded-xl text-sm">Guardar Producto</button>
        <button id="btn-cancelar" onclick="limpiarFormularioProducto()" class="hidden py-3 px-4 bg-dark-bg border border-dark-border text-gray-300 font-bold rounded-xl text-sm">Cancelar</button>
      </div>
    </section>

    <!-- LISTA PRODUCTOS -->
    <section class="bg-dark-card p-5 rounded-2xl shadow-sm border border-dark-border space-y-4">
      <h2 class="font-bold text-base text-white border-b border-dark-border pb-2">📋 Productos Cargados</h2>
      <div id="lista-admin-productos" class="space-y-3"></div>
    </section>

  </main>

  <!-- LÓGICA ADMIN -->
  <script>
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "1234";
    const SUPABASE_URL = 'https://ahyvmupqzgcrxrbvjzsb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoeXZtdXBxemdjcnhyYnZqenNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTg5MzcsImV4cCI6MjEwODA5NDkzN30.oBfYP5Pf0hXDymQtMqE2pFbWCVllRKWcYGew0iuca4Q';

    const _supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const BUCKET_NAME = 'imagenes-productos';

    let listaProductos = [];
    let configActualId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (sessionStorage.getItem('admin_logueado') === 'true') document.getElementById('modal-login').classList.add('hidden');
      await cargarConfiguracionAdmin();
      await cargarEstadoPromoAdmin();
      await cargarProductosAdmin();
    });

    function verificarLogin() {
      if (document.getElementById('login-user').value.trim() === ADMIN_USER && document.getElementById('login-pass').value.trim() === ADMIN_PASS) {
        sessionStorage.setItem('admin_logueado', 'true');
        document.getElementById('modal-login').classList.add('hidden');
      } else alert("Credenciales incorrectas.");
    }

    function cerrarSesion() { sessionStorage.removeItem('admin_logueado'); location.reload(); }

    async function subirImagenASupabase(file, carpeta = 'general') {
      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
        const filePath = `${carpeta}/${fileName}`;
        const { error } = await _supabaseClient.storage.from(BUCKET_NAME).upload(filePath, file);
        if (error) throw error;
        const { data } = _supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(filePath);
        return data.publicUrl;
      } catch (e) { alert("Error al subir foto: " + e.message); return null; }
    }

    async function subirPromocion() {
      const fileInput = document.getElementById('file-promo');
      const texto = document.getElementById('promo-texto').value.trim();

      if (fileInput.files.length === 0) {
        alert("Por favor selecciona una imagen para la promoción.");
        return;
      }

      alert("Subiendo la promo...");
      const uploadedUrl = await subirImagenASupabase(fileInput.files[0], 'promos');

      if (uploadedUrl) {
        const { error } = await _supabaseClient.from('promociones').insert([{
          imagen_url: uploadedUrl,
          texto_promo: texto
        }]);

        if (error) alert("Error: " + error.message);
        else {
          alert("¡Promoción publicada exitosamente! Estará activa por 24 horas en la foto de perfil.");
          fileInput.value = '';
          document.getElementById('promo-texto').value = '';
          await cargarEstadoPromoAdmin();
        }
      }
    }

    async function cargarEstadoPromoAdmin() {
      try {
        const { data } = await _supabaseClient.from('promociones').select('*').order('creado_en', { ascending: false }).limit(1).maybeSingle();
        if (data) {
          const hace24Horas = new Date(Date.now() - 24 * 60 * 60 * 1000);
          const fecha = new Date(data.creado_en);

          if (fecha > hace24Horas) {
            const horasRestantes = Math.round((fecha - hace24Horas) / (1000 * 60 * 60));
            document.getElementById('promo-status-box').classList.remove('hidden');
            document.getElementById('promo-status-text').textContent = data.texto_promo || 'Imagen de oferta activa';
            document.getElementById('promo-status-timer').textContent = `⏰ Le quedan aprox. ${horasRestantes}hs de visibilidad.`;
          }
        }
      } catch (e) {}
    }

    async function cargarConfiguracionAdmin() {
      try {
        const { data } = await _supabaseClient.from('configuracion').select('*').limit(1).maybeSingle();
        if (data) {
          configActualId = data.id;
          document.getElementById('cfg-nombre').value = data.nombre || '';
          document.getElementById('cfg-ws1').value = data.whatsapp_1 || '';
          document.getElementById('cfg-alias').value = data.alias || '';
          document.getElementById('cfg-titular').value = data.titular || '';
          document.getElementById('cfg-logo').value = data.logo_url || '';
          document.getElementById('cfg-delivery').value = data.costo_delivery || 0;
          if (data.abierto !== undefined) document.getElementById('cfg-abierto').value = data.abierto.toString();
        }
      } catch (e) {}
    }

    async function guardarConfiguracion() {
      const fileInput = document.getElementById('file-logo');
      let logoUrl = document.getElementById('cfg-logo').value.trim();

      if (fileInput.files.length > 0) {
        const uploadedUrl = await subirImagenASupabase(fileInput.files[0], 'logos');
        if (uploadedUrl) logoUrl = uploadedUrl;
      }

      const datos = {
        nombre: document.getElementById('cfg-nombre').value.trim(),
        whatsapp_1: document.getElementById('cfg-ws1').value.trim(),
        alias: document.getElementById('cfg-alias').value.trim(),
        titular: document.getElementById('cfg-titular').value.trim(),
        logo_url: logoUrl,
        abierto: document.getElementById('cfg-abierto').value === 'true',
        costo_delivery: parseFloat(document.getElementById('cfg-delivery').value) || 0
      };

      const res = configActualId 
        ? await _supabaseClient.from('configuracion').update(datos).eq('id', configActualId)
        : await _supabaseClient.from('configuracion').insert([datos]);

      if (res.error) alert("Error guardando: " + res.error.message);
      else alert("¡Configuración guardada!");
    }

    async function cargarProductosAdmin() {
      try {
        const { data } = await _supabaseClient.from('productos').select('*').order('id', { ascending: false });
        listaProductos = data || [];
        const container = document.getElementById('lista-admin-productos');
        container.innerHTML = '';
        listaProductos.forEach(p => {
          const estaPausado = p.pausado === true || p.pausado === 'true' || p.pausado === 1;
          container.innerHTML += `
            <div class="flex items-center justify-between p-3 border border-dark-border rounded-xl bg-dark-bg gap-3">
              <img src="${p.imagen_url || 'https://via.placeholder.com/80'}" class="w-12 h-12 rounded-lg object-cover bg-dark-card">
              <div class="flex-1">
                <h3 class="font-bold text-sm text-white">${p.nombre}</h3>
                <p class="text-xs text-gray-400">$${p.precio}</p>
              </div>
              <div class="flex gap-1.5">
                <button onclick="togglePausarProducto(${p.id}, ${!estaPausado})" class="p-2 text-xs font-bold rounded-lg ${estaPausado ? 'bg-emerald-950 text-emerald-400' : 'bg-amber-950 text-amber-400'}">${estaPausado ? '🟢 Activar' : '⏸️ Pausar'}</button>
                <button onclick="prepararEdicion(${p.id})" class="p-2 text-xs bg-dark-card text-blue-400 font-bold rounded-lg">✏️</button>
                <button onclick="eliminarProducto(${p.id})" class="p-2 text-xs bg-dark-card text-red-400 font-bold rounded-lg">🗑️</button>
              </div>
            </div>
          `;
        });
      } catch (e) {}
    }

    async function togglePausarProducto(id, nuevoEstado) {
      await _supabaseClient.from('productos').update({ pausado: nuevoEstado }).eq('id', id);
      await cargarProductosAdmin();
    }

    async function guardarProducto() {
      const id = document.getElementById('prod-id').value;
      const fileInput = document.getElementById('file-producto');
      let imagenUrl = document.getElementById('prod-imagen').value.trim();

      if (fileInput.files.length > 0) {
        const uploadedUrl = await subirImagenASupabase(fileInput.files[0], 'productos');
        if (uploadedUrl) imagenUrl = uploadedUrl;
      }

      const datosProd = {
        nombre: document.getElementById('prod-nombre').value.trim(),
        precio: parseFloat(document.getElementById('prod-precio').value),
        categoria: document.getElementById('prod-categoria').value.trim(),
        descripcion: document.getElementById('prod-descripcion').value.trim(),
        imagen_url: imagenUrl
      };

      if (id) await _supabaseClient.from('productos').update(datosProd).eq('id', id);
      else await _supabaseClient.from('productos').insert([datosProd]);

      limpiarFormularioProducto();
      await cargarProductosAdmin();
    }

    function prepararEdicion(id) {
      const p = listaProductos.find(item => item.id === id);
      if (!p) return;
      document.getElementById('prod-id').value = p.id;
      document.getElementById('prod-nombre').value = p.nombre || '';
      document.getElementById('prod-precio').value = p.precio || '';
      document.getElementById('prod-categoria').value = p.categoria || '';
      document.getElementById('prod-descripcion').value = p.descripcion || '';
      document.getElementById('prod-imagen').value = p.imagen_url || '';
      document.getElementById('btn-cancelar').classList.remove('hidden');
    }

    function limpiarFormularioProducto() {
      document.getElementById('prod-id').value = '';
      document.getElementById('prod-nombre').value = '';
      document.getElementById('prod-precio').value = '';
      document.getElementById('prod-categoria').value = '';
      document.getElementById('prod-descripcion').value = '';
      document.getElementById('prod-imagen').value = '';
      document.getElementById('btn-cancelar').classList.add('hidden');
    }

    async function eliminarProducto(id) {
      if (confirm("¿Eliminar producto?")) {
        await _supabaseClient.from('productos').delete().eq('id', id);
        await cargarProductosAdmin();
      }
    }
  </script>
</body>
</html>
