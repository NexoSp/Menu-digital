<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Menú Digital</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-12">

  <!-- HEADER / CABECERA -->
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-2xl mx-auto p-4 flex items-center justify-between">
      <h1 class="font-bold text-lg text-gray-800">⚙️ Panel de Control Admin</h1>
      <a href="index.html" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg border font-medium">Ver Menú ↗</a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto p-4 space-y-6">

    <!-- SECCIÓN 1: CONFIGURACIÓN DEL NEGOCIO, PAGOS Y DISEÑO -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-4">
      <h2 class="font-bold text-base text-gray-800 flex items-center gap-2 border-b pb-2">
        <span>🏪 Datos del Negocio, Pagos y Diseño</span>
      </h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre del Local</label>
          <input type="text" id="cfg-nombre" placeholder="Ej: PERE Y EL FLACO" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Estado del Local</label>
          <select id="cfg-abierto" class="w-full p-2.5 border rounded-xl text-sm bg-white focus:ring-2 focus:ring-red-400 focus:outline-none font-medium">
            <option value="true">🟢 Abierto (Aceptando pedidos)</option>
            <option value="false">🔴 Cerrado (Local no disponible)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">WhatsApp 1 (Sin + ni espacios)</label>
          <input type="text" id="cfg-ws1" placeholder="Ej: 5491122334455" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">WhatsApp 2 (Opcional)</label>
          <input type="text" id="cfg-ws2" placeholder="Ej: 5491199887766" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Alias Mercado Pago / CBU</label>
          <input type="text" id="cfg-alias" placeholder="Ej: pere.el.flaco.mp" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
        </div>

        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Titular de la Cuenta</label>
          <input type="text" id="cfg-titular" placeholder="Ej: Juan Pérez / Pere y El Flaco SRL" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
        </div>

        <!-- LOGO DEL LOCAL (Subir archivo o URL) -->
        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-gray-700 mb-1">🖼️ Logo del Local (Sube una imagen desde tu dispositivo)</label>
          <input type="hidden" id="cfg-logo">
          <div class="flex items-center gap-2">
            <input type="file" id="file-logo" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 cursor-pointer border rounded-xl p-1">
          </div>
          <p id="logo-status" class="text-[11px] text-gray-400 mt-1">Selecciona una imagen si deseas cambiar el logo actual.</p>
        </div>

        <!-- SELECTOR DE COLOR PRINCIPAL -->
        <div class="sm:col-span-2 border-t pt-3 mt-1">
          <label class="block text-xs font-semibold text-gray-700 mb-2">🎨 Color Principal del Menú (Botones y Encabezados)</label>
          <div class="flex items-center gap-3">
            <input type="color" id="cfg-color" value="#e11d48" class="w-12 h-10 p-1 border rounded-xl cursor-pointer bg-white">
            <input type="text" id="cfg-color-hex" value="#e11d48" readonly class="w-24 p-2 border rounded-xl text-xs text-center font-mono font-bold bg-gray-50 text-gray-600">
            
            <!-- Paleta rápida de colores -->
            <div class="flex items-center gap-1.5 ml-auto">
              <button type="button" onclick="seleccionarColor('#e11d48')" class="w-6 h-6 rounded-full bg-rose-600 border border-black/10"></button>
              <button type="button" onclick="seleccionarColor('#16a34a')" class="w-6 h-6 rounded-full bg-green-600 border border-black/10"></button>
              <button type="button" onclick="seleccionarColor('#2563eb')" class="w-6 h-6 rounded-full bg-blue-600 border border-black/10"></button>
              <button type="button" onclick="seleccionarColor('#ea580c')" class="w-6 h-6 rounded-full bg-orange-600 border border-black/10"></button>
              <button type="button" onclick="seleccionarColor('#9333ea')" class="w-6 h-6 rounded-full bg-purple-600 border border-black/10"></button>
              <button type="button" onclick="seleccionarColor('#18181b')" class="w-6 h-6 rounded-full bg-zinc-900 border border-black/10"></button>
            </div>
          </div>
        </div>

      </div>

      <button onclick="guardarConfiguracion()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm transition-colors shadow-sm">
        💾 Guardar Configuración
      </button>
      <p id="cfg-msg" class="text-xs text-center font-semibold hidden"></p>
    </section>


    <!-- SECCIÓN 2: AGREGAR / EDITAR PRODUCTO -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-4">
      <h2 class="font-bold text-base text-gray-800 flex items-center gap-2 border-b pb-2">
        <span id="form-title">🍔 Agregar Nuevo Producto</span>
      </h2>

      <input type="hidden" id="prod-id">
      <input type="hidden" id="prod-imagen">

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre del Producto</label>
          <input type="text" id="prod-nombre" placeholder="Ej: Hamburguesa Doble Con Queso" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Precio ($)</label>
            <input type="number" id="prod-precio" placeholder="4500" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Categoría</label>
            <input type="text" id="prod-categoria" placeholder="Ej: Hamburguesas" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-red-400 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Descripción</label>
          <textarea id="prod-descripcion" rows="2" placeholder="Medallón doble de carne, cheddar, bacon y salsa especial..." class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-red-400 focus:outline-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Imagen del Producto (Desde el dispositivo)</label>
          <input type="file" id="file-producto" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 cursor-pointer border rounded-xl p-1">
          <p id="prod-img-status" class="text-[11px] text-gray-400 mt-1">Selecciona una foto para subirla al servidor.</p>
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="guardarProducto()" class="flex-1 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl text-sm transition-colors shadow-sm">
          Guardar Producto
        </button>
        <button id="btn-cancelar" onclick="limpiarFormularioProducto()" class="hidden py-3 px-4 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-xl text-sm transition-colors">
          Cancelar
        </button>
      </div>
    </section>

    <!-- SECCIÓN 3: LISTADO DE PRODUCTOS -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-4">
      <h2 class="font-bold text-base text-gray-800 border-b pb-2">📋 Productos Cargados</h2>
      <div id="lista-admin-productos" class="space-y-3">
        <p class="text-center text-sm text-gray-400 py-4">Cargando productos...</p>
      </div>
    </section>

  </main>

  <!-- LÓGICA JAVASCRIPT ADMIN -->
  <script>
    // --- CONFIGURACIÓN DE SUPABASE ---
    const SUPABASE_URL = 'https://ahyvmupqzgcrxrbvjzsb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoeXZtdXBxemdjcnhyYnZqenNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTg5MzcsImV4cCI6MjEwODA5NDkzN30.oBfYP5Pf0hXDymQtMqE2pFbWCVllRKWcYGew0iuca4Q';

    const _supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const BUCKET_NAME = 'imagenes-productos';

    let listaProductos = [];
    let configActualId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const inputColor = document.getElementById('cfg-color');
      const inputHex = document.getElementById('cfg-color-hex');
      inputColor.addEventListener('input', (e) => {
        inputHex.value = e.target.value;
      });

      try {
        await cargarConfiguracionAdmin();
      } catch (e) {
        console.error("Error al inicializar configuración:", e);
      }

      try {
        await cargarProductosAdmin();
      } catch (e) {
        console.error("Error al inicializar productos:", e);
        document.getElementById('lista-admin-productos').innerHTML = '<p class="text-center text-red-500 text-xs py-4">Error al cargar la lista de productos.</p>';
      }
    });

    function seleccionarColor(hex) {
      document.getElementById('cfg-color').value = hex;
      document.getElementById('cfg-color-hex').value = hex;
    }

    // --- FUNCIÓN PARA SUBIR ARCHIVOS A SUPABASE STORAGE ---
    async function subirImagenASupabase(file, carpeta = 'general') {
      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
        const filePath = `${carpeta}/${fileName}`;

        const { data, error } = await _supabaseClient.storage
          .from(BUCKET_NAME)
          .upload(filePath, file);

        if (error) throw error;

        const { data: publicData } = _supabaseClient.storage
          .from(BUCKET_NAME)
          .getPublicUrl(filePath);

        return publicData.publicUrl;
      } catch (err) {
        console.error("Error al subir imagen:", err);
        alert("Error al subir la imagen: " + err.message);
        return null;
      }
    }

    // --- CARGAR Y GUARDAR CONFIGURACIÓN ---
    async function cargarConfiguracionAdmin() {
      try {
        const { data, error } = await _supabaseClient.from('configuracion').select('*').limit(1).maybeSingle();
        if (data) {
          configActualId = data.id;
          document.getElementById('cfg-nombre').value = data.nombre || '';
          document.getElementById('cfg-ws1').value = data.whatsapp_1 || '';
          document.getElementById('cfg-ws2').value = data.whatsapp_2 || '';
          document.getElementById('cfg-alias').value = data.alias || '';
          document.getElementById('cfg-titular').value = data.titular || '';
          document.getElementById('cfg-logo').value = data.logo_url || '';
          
          if (data.abierto !== undefined) {
            document.getElementById('cfg-abierto').value = data.abierto ? "true" : "false";
          }
          
          if (data.logo_url) {
            document.getElementById('logo-status').textContent = "✓ Logo actual cargado correctamente.";
            document.getElementById('logo-status').className = "text-[11px] text-emerald-600 font-semibold mt-1";
          }
          
          const colorGuardado = data.color_primario || data.color || '#e11d48';
          seleccionarColor(colorGuardado);
        }
      } catch (err) {
        console.error("Error al cargar la configuración:", err);
      }
    }

    async function guardarConfiguracion() {
      const msgElem = document.getElementById('cfg-msg');
      const colorSeleccionado = document.getElementById('cfg-color').value;
      const fileInput = document.getElementById('file-logo');
      const estadoAbierto = document.getElementById('cfg-abierto').value === 'true';

      let logoUrl = document.getElementById('cfg-logo').value.trim();

      if (fileInput.files.length > 0) {
        msgElem.textContent = "⌛ Subiendo logo...";
        msgElem.className = "text-xs text-center font-semibold text-blue-600 pt-1";
        msgElem.classList.remove('hidden');
        
        const uploadedUrl = await subirImagenASupabase(fileInput.files[0], 'logos');
        if (uploadedUrl) {
          logoUrl = uploadedUrl;
          document.getElementById('cfg-logo').value = logoUrl;
        }
      }

      const datos = {
        nombre: document.getElementById('cfg-nombre').value.trim(),
        whatsapp_1: document.getElementById('cfg-ws1').value.trim(),
        whatsapp_2: document.getElementById('cfg-ws2').value.trim(),
        alias: document.getElementById('cfg-alias').value.trim(),
        titular: document.getElementById('cfg-titular').value.trim(),
        logo_url: logoUrl,
        color_primario: colorSeleccionado,
        abierto: estadoAbierto
      };

      try {
        let error;
        if (configActualId) {
          const res = await _supabaseClient.from('configuracion').update(datos).eq('id', configActualId);
          error = res.error;
        } else {
          const res = await _supabaseClient.from('configuracion').insert([datos]);
          error = res.error;
        }

        // Reintento inteligente si alguna columna nueva no existe en la base de datos
        if (error && (error.message.includes('color_primario') || error.message.includes('logo_url') || error.message.includes('abierto') || error.message.includes('column'))) {
          delete datos.color_primario;
          delete datos.logo_url;
          delete datos.abierto;
          if (configActualId) {
            const resRetry = await _supabaseClient.from('configuracion').update(datos).eq('id', configActualId);
            error = resRetry.error;
          } else {
            const resRetry = await _supabaseClient.from('configuracion').insert([datos]);
            error = resRetry.error;
          }
        }

        if (error) throw error;

        msgElem.textContent = "✓ Configuración guardada exitosamente.";
        msgElem.className = "text-xs text-center font-semibold text-emerald-600 pt-1";
        msgElem.classList.remove('hidden');
        setTimeout(() => msgElem.classList.add('hidden'), 3000);

      } catch (err) {
        alert("Error guardando la configuración: " + err.message);
      }
    }

    // --- CARGAR Y RENDERIZAR PRODUCTOS ---
    async function cargarProductosAdmin() {
      try {
        const { data, error } = await _supabaseClient.from('productos').select('*').order('id', { ascending: false });
        if (error) throw error;

        listaProductos = data || [];
        const container = document.getElementById('lista-admin-productos');
        container.innerHTML = '';

        if (listaProductos.length === 0) {
          container.innerHTML = '<p class="text-center text-xs text-gray-400 py-4">No hay productos registrados.</p>';
          return;
        }

        listaProductos.forEach(p => {
          const estaPausado = p.pausado === true;
          const estadoClase = estaPausado ? 'bg-amber-50 border-amber-200 opacity-75' : 'bg-gray-50';
          const botonPausarTexto = estaPausado ? '🟢 Activar' : '⏸️ Pausar';
          const botonPausarClase = estaPausado ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-amber-100 text-amber-700 hover:bg-amber-200';

          container.innerHTML += `
            <div class="flex items-center justify-between p-3 border rounded-xl ${estadoClase} gap-3">
              <img src="${p.imagen_url || 'https://via.placeholder.com/80'}" class="w-12 h-12 rounded-lg object-cover bg-gray-200">
              <div class="flex-1">
                <h3 class="font-bold text-sm text-gray-800">${p.nombre} ${estaPausado ? '<span class="text-[10px] bg-amber-200 text-amber-800 px-1.5 py-0.5 rounded font-bold">Pausado</span>' : ''}</h3>
                <p class="text-xs text-gray-500">${p.categoria || 'Sin categoría'} - <span class="font-bold text-emerald-600">$${p.precio}</span></p>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="togglePausarProducto(${p.id}, ${!estaPausado})" class="p-2 text-xs ${botonPausarClase} font-bold rounded-lg transition-colors" title="Pausar o Activar">${botonPausarTexto}</button>
                <button onclick="prepararEdicion(${p.id})" class="p-2 text-xs bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold rounded-lg" title="Editar">✏️</button>
                <button onclick="eliminarProducto(${p.id})" class="p-2 text-xs bg-red-100 hover:bg-red-200 text-red-700 font-bold rounded-lg" title="Eliminar">🗑️</button>
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error("Error al cargar productos:", err);
        document.getElementById('lista-admin-productos').innerHTML = '<p class="text-center text-red-500 text-xs py-4">Error al conectar con la tabla de productos.</p>';
      }
    }

    // --- PAUSAR / ACTIVAR PRODUCTO ---
    async function togglePausarProducto(id, nuevoEstado) {
      try {
        const { error } = await _supabaseClient
          .from('productos')
          .update({ pausado: nuevoEstado })
          .eq('id', id);

        if (error) {
          // Si la columna pausado no existe todavía, avisamos al usuario amablemente
          if (error.message.includes('column') || error.message.includes('pausado')) {
            alert("Atención: Para usar la función de pausar productos, asegúrate de agregar una columna booleana llamada 'pausado' en tu tabla 'productos' de Supabase.");
          } else {
            throw error;
          }
        }

        await cargarProductosAdmin();
      } catch (err) {
        alert("Error al actualizar el estado del producto: " + err.message);
      }
    }

    // --- CREAR Y EDITAR PRODUCTO ---
    async function guardarProducto() {
      const id = document.getElementById('prod-id').value;
      const nombre = document.getElementById('prod-nombre').value.trim();
      const precio = parseFloat(document.getElementById('prod-precio').value);
      const categoria = document.getElementById('prod-categoria').value.trim();
      const descripcion = document.getElementById('prod-descripcion').value.trim();
      const fileInput = document.getElementById('file-producto');

      if (!nombre || isNaN(precio)) {
        alert("Por favor, completa al menos el nombre y el precio del producto.");
        return;
      }

      let imagenUrl = document.getElementById('prod-imagen').value.trim();

      if (fileInput.files.length > 0) {
        document.getElementById('prod-img-status').textContent = "⌛ Subiendo imagen de producto...";
        document.getElementById('prod-img-status').className = "text-[11px] text-blue-600 font-semibold mt-1";
        
        const uploadedUrl = await subirImagenASupabase(fileInput.files[0], 'productos');
        if (uploadedUrl) {
          imagenUrl = uploadedUrl;
        }
      }

      const datosProd = { nombre, precio, categoria, descripcion, imagen_url: imagenUrl };

      try {
        if (id) {
          await _supabaseClient.from('productos').update(datosProd).eq('id', id);
        } else {
          await _supabaseClient.from('productos').insert([datosProd]);
        }

        limpiarFormularioProducto();
        await cargarProductosAdmin();
      } catch (err) {
        alert("Error al guardar el producto: " + err.message);
      }
    }

    function prepararEdicion(id) {
      const p = listaProductos.find(item => item.id === id);
      if (!p) return;

      document.getElementById('prod-id').value = p.id;
      document.getElementById('prod-nombre').value = p.nombre || '';
      document.getElementById('prod-precio').value = p.precio || '';
      document.getElementById('prod-categoria').value = p.categoria || '';
      document.getElementById('prod-descripcion').value = p.descripcion || '';
      document.getElementById('prod-imagen').value = p.imagen_url || '';

      document.getElementById('form-title').textContent = "✏️ Editar Producto";
      document.getElementById('file-producto').value = '';
      document.getElementById('prod-img-status').textContent = p.imagen_url ? "✓ Producto con imagen cargada." : "Selecciona una foto nueva si deseas cambiarla.";
      document.getElementById('btn-cancelar').classList.remove('hidden');
      window.scrollTo({ top: 300, behavior: 'smooth' });
    }

    function limpiarFormularioProducto() {
      document.getElementById('prod-id').value = '';
      document.getElementById('prod-nombre').value = '';
      document.getElementById('prod-precio').value = '';
      document.getElementById('prod-categoria').value = '';
      document.getElementById('prod-descripcion').value = '';
      document.getElementById('prod-imagen').value = '';
      document.getElementById('file-producto').value = '';
      document.getElementById('prod-img-status').textContent = "Selecciona una foto para subirla al servidor.";

      document.getElementById('form-title').textContent = "🍔 Agregar Nuevo Producto";
      document.getElementById('btn-cancelar').classList.add('hidden');
    }

    // --- ELIMINAR PRODUCTO ---
    async function eliminarProducto(id) {
      if (!confirm("¿Estás seguro de que deseas eliminar este producto?")) return;

      try {
        await _supabaseClient.from('productos').delete().eq('id', id);
        await cargarProductosAdmin();
      } catch (err) {
        alert("Error al eliminar el producto: " + err.message);
      }
    }
  </script>
</body>
</html>
