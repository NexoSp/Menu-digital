<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Menú</title>
  <!-- Tailwind CSS para diseño -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SDK oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-gray-900 text-white p-4 shadow-md sticky top-0 z-30">
    <div class="max-w-xl mx-auto flex justify-between items-center gap-2">
      <div>
        <h1 class="text-lg font-bold">⚙️ Panel de Control</h1>
        <p class="text-xs text-gray-400">Gestión del local y productos</p>
      </div>
      <div class="flex items-center gap-2">
        <!-- Botón para alternar Estado del Local (Abierto/Cerrado) -->
        <button id="btn-estado-local" class="bg-gray-700 text-white text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-1 transition-all">
          <i class="fa-solid fa-spinner fa-spin"></i> Cargando...
        </button>
        <a href="index.html" target="_blank" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1 transition-all">
          <i class="fa-solid fa-eye"></i> Menú Web
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-6">

    <!-- Formulario para agregar producto -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-800 mb-4 text-base flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-red-600"></i> Agregar Nuevo Producto
      </h2>

      <form id="form-producto" onsubmit="guardarProducto(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Nombre del producto *</label>
          <input type="text" id="nombre" required placeholder="Ej: Hamburguesa Triple" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Precio ($) *</label>
            <input type="number" id="precio" required placeholder="Ej: 6500" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Categoría</label>
            <input type="text" id="categoria" placeholder="Ej: Hamburguesas" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Descripción</label>
          <textarea id="descripcion" rows="2" placeholder="Ej: Triple carne, cheddar y cebolla caramelizada" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none"></textarea>
        </div>

        <!-- Cargar imagen desde el dispositivo -->
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Imagen del Producto (Galería o Archivo)</label>
          <input type="file" id="imagen-archivo" accept="image/*" class="w-full border rounded-lg p-2 text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100">
        </div>

        <button type="submit" id="btn-guardar" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl shadow transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-save"></i> Guardar Producto
        </button>
      </form>
    </section>

    <!-- Lista de Productos Existentes -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-800 mb-4 text-base flex items-center gap-2">
        <i class="fa-solid fa-list text-gray-700"></i> Productos en la Base de Datos
      </h2>

      <div id="lista-productos" class="space-y-3">
        <p class="text-center text-gray-500 text-sm py-4"><i class="fa-solid fa-spinner fa-spin"></i> Cargando productos...</p>
      </div>
    </section>

  </main>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE SUPABASE
    // ==========================================
    const SUPABASE_URL = "https://ahyvmupqzgcrxrbvjzsb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_zXDGyQ8Sphn0F1gIr7s9jQ_pOOKf08w"; 

    const dbSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 1. GESTIÓN DEL ESTADO DEL LOCAL (ABIERTO / CERRADO)
    async function obtenerEstadoLocal() {
      try {
        const { data, error } = await dbSupabase
          .from('configuracion')
          .select('abierto')
          .eq('id', 1)
          .single();

        if (error) throw error;
        actualizarBotonEstado(data ? data.abierto : true);
      } catch (err) {
        console.error("Error al obtener estado:", err);
      }
    }

    function actualizarBotonEstado(estaAbierto) {
      const btn = document.getElementById('btn-estado-local');
      if (estaAbierto) {
        btn.className = "bg-green-600 hover:bg-green-700 text-white text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-1 transition-all";
        btn.innerHTML = `<i class="fa-solid fa-clock"></i> ABIERTO`;
        btn.onclick = () => cambiarEstadoLocal(false);
      } else {
        btn.className = "bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded-lg font-bold flex items-center gap-1 transition-all";
        btn.innerHTML = `<i class="fa-solid fa-lock"></i> CERRADO`;
        btn.onclick = () => cambiarEstadoLocal(true);
      }
    }

    async function cambiarEstadoLocal(nuevoEstado) {
      try {
        const { error } = await dbSupabase
          .from('configuracion')
          .update({ abierto: nuevoEstado })
          .eq('id', 1);

        if (error) throw error;
        actualizarBotonEstado(nuevoEstado);
      } catch (err) {
        console.error("Error al cambiar estado:", err);
        alert("No se pudo cambiar el estado del local.");
      }
    }

    // 2. GESTIÓN DE PRODUCTOS
    async function obtenerProductosAdmin() {
      const contenedor = document.getElementById('lista-productos');
      try {
        const { data: productos, error } = await dbSupabase
          .from('productos')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        if (!productos || productos.length === 0) {
          contenedor.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">No hay productos cargados todavía.</p>';
          return;
        }

        renderizarProductosAdmin(productos);
      } catch (err) {
        console.error("Error al cargar productos:", err);
        contenedor.innerHTML = '<p class="text-center text-red-500 text-sm py-4">Error al conectar con la base de datos.</p>';
      }
    }

    function renderizarProductosAdmin(productos) {
      const contenedor = document.getElementById('lista-productos');
      contenedor.innerHTML = '';

      productos.forEach(prod => {
        const estaDisponible = prod.disponible;
        const html = `
          <div class="flex items-center justify-between p-3 border rounded-xl bg-gray-50 gap-3">
            <img src="${prod.imagen || 'https://via.placeholder.com/80'}" class="w-14 h-14 object-cover rounded-lg flex-shrink-0">
            <div class="flex-1 min-w-0">
              <h3 class="font-bold text-gray-800 text-sm truncate">${prod.nombre}</h3>
              <p class="text-xs font-semibold text-red-600">$${prod.precio}</p>
              <span class="inline-block text-[10px] px-2 py-0.5 rounded-full ${estaDisponible ? 'bg-green-100 text-green-800' : 'bg-gray-200 text-gray-600'} font-bold">
                ${estaDisponible ? 'Disponible' : 'Pausado'}
              </span>
            </div>
            <div class="flex gap-2">
              <button onclick="cambiarDisponibilidad(${prod.id}, ${!estaDisponible})" title="Pausar/Activar" class="p-2 rounded-lg ${estaDisponible ? 'bg-yellow-100 text-yellow-700 hover:bg-yellow-200' : 'bg-green-100 text-green-700 hover:bg-green-200'} text-xs font-bold transition-all">
                <i class="fa-solid ${estaDisponible ? 'fa-pause' : 'fa-play'}"></i>
              </button>
              <button onclick="eliminarProducto(${prod.id})" title="Eliminar" class="p-2 rounded-lg bg-red-100 text-red-700 hover:bg-red-200 text-xs font-bold transition-all">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
        contenedor.innerHTML += html;
      });
    }

    async function guardarProducto(event) {
      event.preventDefault();
      const btn = document.getElementById('btn-guardar');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Subiendo imagen y guardando...';

      let urlImagenFinal = 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd';
      const archivoInput = document.getElementById('imagen-archivo');

      try {
        if (archivoInput.files.length > 0) {
          const archivo = archivoInput.files[0];
          const extension = archivo.name.split('.').pop();
          const nombreArchivoUnico = `prod_${Date.now()}.${extension}`;

          const { error: uploadError } = await dbSupabase.storage
            .from('imagenes-productos')
            .upload(nombreArchivoUnico, archivo);

          if (uploadError) throw uploadError;

          const { data: urlData } = dbSupabase.storage
            .from('imagenes-productos')
            .getPublicUrl(nombreArchivoUnico);

          urlImagenFinal = urlData.publicUrl;
        }

        const nuevoProd = {
          nombre: document.getElementById('nombre').value.trim(),
          precio: parseFloat(document.getElementById('precio').value),
          categoria: document.getElementById('categoria').value.trim() || 'General',
          descripcion: document.getElementById('descripcion').value.trim(),
          imagen: urlImagenFinal,
          disponible: true
        };

        const { error: insertError } = await dbSupabase.from('productos').insert([nuevoProd]);
        if (insertError) throw insertError;

        alert("¡Producto e imagen guardados con éxito!");
        document.getElementById('form-producto').reset();
        obtenerProductosAdmin();
      } catch (err) {
        console.error("Error al guardar:", err);
        alert("Error al subir la imagen o guardar el producto. Revisa los permisos de Storage.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-save"></i> Guardar Producto';
      }
    }

    async function cambiarDisponibilidad(id, nuevoEstado) {
      try {
        const { error } = await dbSupabase
          .from('productos')
          .update({ disponible: nuevoEstado })
          .eq('id', id);

        if (error) throw error;
        obtenerProductosAdmin();
      } catch (err) {
        console.error("Error al actualizar:", err);
      }
    }

    async function eliminarProducto(id) {
      if (!confirm("¿Seguro que deseas eliminar este producto definitivamente?")) return;

      try {
        const { error } = await dbSupabase
          .from('productos')
          .delete()
          .eq('id', id);

        if (error) throw error;
        obtenerProductosAdmin();
      } catch (err) {
        console.error("Error al eliminar:", err);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      obtenerEstadoLocal();
      obtenerProductosAdmin();
    });
  </script>
</body>
</html>
