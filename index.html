<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Digital Interactivo</title>
  <!-- Tailwind CSS para diseño y estilos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SDK oficial de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 pb-24 font-sans">

  <!-- Header / Encabezado -->
  <header class="bg-red-600 text-white p-4 sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold">🍔 Burguer & Co.</h1>
        <p class="text-xs text-red-100">Haz tu pedido rápido por WhatsApp</p>
      </div>
      <!-- Badge dinámico de Abierto / Cerrado -->
      <span id="badge-estado" class="bg-gray-700 text-white text-xs px-2.5 py-1 rounded-full font-semibold transition-all">
        <i class="fa-solid fa-spinner fa-spin"></i>
      </span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4">

    <!-- Mensaje si el local está cerrado -->
    <div id="mensaje-cerrado" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded-xl mb-6 shadow-sm">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation text-lg"></i>
        <p class="font-bold text-sm">El local se encuentra CERRADO en este momento.</p>
      </div>
      <p class="text-xs mt-1 text-red-600">Puedes mirar nuestro menú, pero no se están tomando pedidos por el momento.</p>
    </div>

    <!-- Datos del Cliente -->
    <section class="bg-white p-4 rounded-xl shadow-sm mb-6">
      <h2 class="font-bold text-gray-800 mb-3 text-sm uppercase tracking-wide">1. Tus datos de entrega</h2>
      <div class="space-y-3">
        <input type="text" id="cliente-nombre" placeholder="Tu Nombre completo" class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
        
        <select id="tipo-entrega" onchange="alternarDireccion()" class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
          <option value="Delivery">🚀 Envío a Domicilio (Delivery)</option>
          <option value="Retiro">🏃 Retiro en el local</option>
          <option value="Mesa">🍽️ Comer en el Local (Mesa)</option>
        </select>

        <input type="text" id="cliente-direccion" placeholder="Dirección completa y altura" class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>
    </section>

    <!-- Listado de Productos -->
    <section>
      <h2 class="font-bold text-gray-800 mb-3 text-sm uppercase tracking-wide">2. Elige tus productos</h2>
      
      <!-- Contenedor dinámico -->
      <div id="contenedor-productos" class="space-y-4">
        <p class="text-center text-gray-500 py-8"><i class="fa-solid fa-spinner fa-spin"></i> Cargando menú...</p>
      </div>
    </section>

  </main>

  <!-- Barra Flotante del Carrito -->
  <div id="barra-carrito" class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-2xl z-40 hidden">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <p class="text-xs text-gray-500">Total acumulado</p>
        <p id="total-precio" class="text-xl font-black text-red-600">$0</p>
      </div>
      <button id="btn-enviar-pedido" onclick="enviarPedidoWhatsApp()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg flex items-center gap-2 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
        <i class="fa-brands fa-whatsapp text-xl"></i>
        <span>Enviar Pedido</span>
      </button>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE SUPABASE Y WHATSAPP
    // ==========================================
    const SUPABASE_URL = "https://ahyvmupqzgcrxrbvjzsb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_zXDGyQ8Sphn0F1gIr7s9jQ_pOOKf08w"; 
    const NUMERO_WHATSAPP = "5493644509472"; 

    const dbSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let carrito = {};
    let localEstaAbierto = true;

    // Verificar si el local está abierto o cerrado
    async function verificarEstadoLocal() {
      try {
        const { data, error } = await dbSupabase
          .from('configuracion')
          .select('abierto')
          .eq('id', 1)
          .single();

        if (error) throw error;

        localEstaAbierto = data ? data.abierto : true;
        const badge = document.getElementById('badge-estado');
        const bannerCerrado = document.getElementById('mensaje-cerrado');
        const btnPedido = document.getElementById('btn-enviar-pedido');

        if (localEstaAbierto) {
          badge.className = "bg-green-500 text-white text-xs px-2.5 py-1 rounded-full font-semibold";
          badge.innerHTML = `<i class="fa-solid fa-clock"></i> Abierto`;
          bannerCerrado.classList.add('hidden');
          if (btnPedido) btnPedido.disabled = false;
        } else {
          badge.className = "bg-gray-800 text-white text-xs px-2.5 py-1 rounded-full font-semibold";
          badge.innerHTML = `<i class="fa-solid fa-lock"></i> Cerrado`;
          bannerCerrado.classList.remove('hidden');
          if (btnPedido) btnPedido.disabled = true;
        }
      } catch (err) {
        console.error("Error al obtener estado del local:", err);
      }
    }

    // Cargar productos
    async function cargarProductos() {
      const contenedor = document.getElementById('contenedor-productos');
      try {
        const { data: productos, error } = await dbSupabase
          .from('productos')
          .select('*')
          .eq('disponible', true);

        if (error) throw error;

        if (!productos || productos.length === 0) {
          contenedor.innerHTML = '<p class="text-center text-gray-500 py-8">No hay productos disponibles por el momento.</p>';
          return;
        }

        renderizarProductos(productos);
      } catch (err) {
        console.error("Error al cargar productos:", err);
        contenedor.innerHTML = '<p class="text-center text-red-500 py-8">Error al cargar el menú. Revisa tu clave de Supabase.</p>';
      }
    }

    function renderizarProductos(productos) {
      const contenedor = document.getElementById('contenedor-productos');
      contenedor.innerHTML = '';

      productos.forEach(prod => {
        const htmlCard = `
          <div class="bg-white rounded-xl p-3 shadow-sm flex gap-3 items-center border border-gray-100">
            <img src="${prod.imagen || 'https://via.placeholder.com/150'}" alt="${prod.nombre}" class="w-20 h-20 object-cover rounded-lg flex-shrink-0">
            <div class="flex-1 min-w-0">
              <h3 class="font-bold text-gray-800 text-sm truncate">${prod.nombre}</h3>
              <p class="text-xs text-gray-500 line-clamp-2 my-1">${prod.descripcion || ''}</p>
              <p class="font-extrabold text-red-600 text-base">$${prod.precio}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="cambiarCantidad(${prod.id}, '${prod.nombre}', ${prod.precio}, -1)" class="w-8 h-8 rounded-full bg-gray-100 text-gray-700 font-bold hover:bg-gray-200 text-sm">-</button>
              <span id="cant-${prod.id}" class="font-bold text-sm w-4 text-center">0</span>
              <button onclick="cambiarCantidad(${prod.id}, '${prod.nombre}', ${prod.precio}, 1)" class="w-8 h-8 rounded-full bg-red-600 text-white font-bold hover:bg-red-700 text-sm">+</button>
            </div>
          </div>
        `;
        contenedor.innerHTML += htmlCard;
      });
    }

    function cambiarCantidad(id, nombre, precio, cambio) {
      if (!carrito[id]) {
        carrito[id] = { nombre, precio, cantidad: 0 };
      }

      carrito[id].cantidad += cambio;

      if (carrito[id].cantidad <= 0) {
        delete carrito[id];
        document.getElementById(`cant-${id}`).innerText = '0';
      } else {
        document.getElementById(`cant-${id}`).innerText = carrito[id].cantidad;
      }

      actualizarCarritoView();
    }

    function actualizarCarritoView() {
      let total = 0;
      let itemsTotales = 0;

      Object.values(carrito).forEach(item => {
        total += item.precio * item.cantidad;
        itemsTotales += item.cantidad;
      });

      const barra = document.getElementById('barra-carrito');
      if (itemsTotales > 0) {
        barra.classList.remove('hidden');
        document.getElementById('total-precio').innerText = `$${total.toLocaleString('es-AR')}`;
      } else {
        barra.classList.add('hidden');
      }
    }

    function alternarDireccion() {
      const tipo = document.getElementById('tipo-entrega').value;
      const inputDir = document.getElementById('cliente-direccion');
      if (tipo === 'Delivery') {
        inputDir.classList.remove('hidden');
        inputDir.placeholder = "Dirección completa y altura";
      } else if (tipo === 'Mesa') {
        inputDir.classList.remove('hidden');
        inputDir.placeholder = "Número de Mesa (ej: Mesa 4)";
      } else {
        inputDir.classList.add('hidden');
      }
    }

    function enviarPedidoWhatsApp() {
      if (!localEstaAbierto) {
        alert("El local se encuentra cerrado en este momento. No es posible enviar el pedido.");
        return;
      }

      const nombre = document.getElementById('cliente-nombre').value.trim();
      const tipoEntrega = document.getElementById('tipo-entrega').value;
      const direccion = document.getElementById('cliente-direccion').value.trim();

      if (!nombre) {
        alert("Por favor, ingresa tu nombre antes de enviar el pedido.");
        return;
      }

      if (tipoEntrega !== 'Retiro' && !direccion) {
        alert("Por favor, ingresa tu dirección o número de mesa.");
        return;
      }

let mensajeWhatsApp = `*NUEVO PEDIDO*\n\n`;
mensajeWhatsApp += `*Cliente:* ${nombre}\n`;
mensajeWhatsApp += `*Total:* $${total}\n\n`;
mensajeWhatsApp += `💳 *Datos de Pago (Mercado Pago):*\n`;
mensajeWhatsApp += `• *Alias:* mi.comercio.mp\n`;
mensajeWhatsApp += `• *Titular:* Nombre del Local\n\n`;
mensajeWhatsApp += `Por favor, envía el comprobante por aquí al realizar la transferencia.`;

      let total = 0;
      Object.values(carrito).forEach(item => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        mensaje += `- ${item.cantidad}x ${item.nombre} ($${subtotal})\n`;
      });

      mensaje += `\n*TOTAL A PAGAR: $${total.toLocaleString('es-AR')}*`;

      const urlWhatsApp = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
      window.open(urlWhatsApp, '_blank');
    }

    document.addEventListener("DOMContentLoaded", () => {
      verificarEstadoLocal();
      cargarProductos();
    });
  </script>
<!-- Pie de página discreto - Marca del desarrollador -->

    </svg>
  </a>
</footer>

</body>
</html>
