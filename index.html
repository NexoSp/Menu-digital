<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Digital - PERE Y EL FLACO</title>

  <!-- Etiquetas Open Graph para WhatsApp y Redes Sociales -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Menú Digital - PERE Y EL FLACO">
  <meta property="og:description" content="Haz tu pedido rápido y fácil por WhatsApp. ¡Conoce nuestro menú!">
  <meta property="og:url" content="https://nexosp.github.io/Menu-digital/">

  <!-- LOGO DIRECTO DE SUPABASE -->
  <meta property="og:image" content="https://ahyvmupqzgcrxrbvjzsb.supabase.co/storage/v1/object/public/imagenes-productos/logos/1792625894900.png">
  <meta property="og:image:secure_url" content="https://ahyvmupqzgcrxrbvjzsb.supabase.co/storage/v1/object/public/imagenes-productos/logos/1792625894900.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="500">
  <meta property="og:image:height" content="500">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>
    :root {
      --primary-color: #ef4444;
    }
    .bg-custom-primary { background-color: var(--primary-color); }
    .text-custom-primary { color: var(--primary-color); }
    .border-custom-primary { border-color: var(--primary-color); }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-28">

  <!-- HEADER / CABECERA -->
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-md mx-auto p-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img id="logo-header" src="https://ahyvmupqzgcrxrbvjzsb.supabase.co/storage/v1/object/public/imagenes-productos/logos/1792625894900.png" alt="Logo" class="w-12 h-12 rounded-full object-cover border border-gray-100 shadow-sm">
        <div>
          <h1 id="nombre-negocio" class="font-bold text-lg text-gray-800 leading-tight">PERE Y EL FLACO</h1>
          <p class="text-xs text-emerald-600 font-medium flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Abierto ahora
          </p>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- FILTRO DE CATEGORÍAS -->
    <div id="categorias-container" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
      <button onclick="filtrarCategoria('todas')" class="cat-btn bg-custom-primary text-white text-xs px-4 py-2 rounded-full font-medium whitespace-nowrap shadow-sm">Todas</button>
    </div>

    <!-- LISTA DE PRODUCTOS -->
    <div id="productos-container" class="space-y-3">
      <p class="text-center text-sm text-gray-500 py-8">Cargando menú...</p>
    </div>

    <!-- SECCIÓN DE DATOS DE ENTREGA -->
    <section class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 space-y-3">
      <h2 class="font-bold text-gray-700 text-sm tracking-wide uppercase">1. Datos de Entrega</h2>
      
      <input type="text" id="cliente-nombre" placeholder="Tu Nombre completo" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-400">
      
      <select id="tipo-entrega" onchange="toggleDireccion()" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-400">
        <option value="Delivery">🚀 Envío a Domicilio (Delivery)</option>
        <option value="Retiro">🛍️ Retiro en el Local</option>
      </select>

      <div id="campo-direccion" class="space-y-2">
        <input type="text" id="cliente-direccion" placeholder="Dirección completa y altura" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-400">
        
        <!-- Botón GPS para el Delivery -->
        <button type="button" onclick="obtenerUbicacionGPS()" class="w-full py-2.5 px-3 bg-blue-50 hover:bg-blue-100 text-blue-600 font-medium text-xs rounded-lg flex items-center justify-center gap-2 border border-blue-200 transition-colors">
          <span>📍 Adjuntar mi ubicación GPS exacta</span>
        </button>
        <p id="gps-status" class="text-[11px] text-emerald-600 font-medium hidden">✓ Ubicación GPS capturada correctamente</p>
      </div>

      <!-- FORMA DE PAGO -->
      <h2 class="font-bold text-gray-700 text-sm tracking-wide uppercase pt-2">2. Forma de Pago</h2>
      <select id="forma-pago" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-400">
        <option value="Efectivo">💵 Efectivo</option>
        <option value="Transferencia">📱 Transferencia bancaria / Alias</option>
      </select>
    </section>

    <!-- FOOTER / PUBLICIDAD SUTIL NEXOSERV -->
    <footer class="text-center pt-2 pb-6">
      <p class="text-xs text-gray-400 font-normal">
        Desarrollado por <span class="font-semibold text-gray-600">NexoServ</span>
      </p>
    </footer>

  </main>

  <!-- BARRA INFERIOR DEL CARRITO FIJA -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 p-3 shadow-lg z-50">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <div>
        <p class="text-xs text-gray-500">Total a Pagar</p>
        <p id="total-pedido" class="font-bold text-xl text-gray-800">$0</p>
      </div>
      <button onclick="enviarPedidoWhatsApp()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-6 rounded-xl text-sm flex items-center gap-2 shadow-md transition-all">
        <span>Enviar Pedido</span>
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12.031 0c-6.627 0-12 5.373-12 12 0 2.159.572 4.187 1.57 5.951l-1.601 5.849 6.012-1.576c1.716.936 3.682 1.455 5.769 1.455 6.627 0 12-5.373 12-12 0-6.627-5.373-12-12-12zm6.657 16.924c-.281.79-1.385 1.448-2.274 1.637-.607.129-1.399.232-4.062-.868-3.411-1.408-5.612-4.887-5.782-5.114-.17-.227-1.386-1.847-1.386-3.52 0-1.674.878-2.497 1.19-2.838.312-.341.681-.426.908-.426.227 0 .454.002.653.011.213.009.497-.081.778.595.284.682.966 2.358 1.05 2.529.085.17.142.369.028.596-.114.227-.17.369-.341.568-.17.199-.356.444-.509.596-.17.17-.347.355-.149.696.199.341.884 1.459 1.898 2.362 1.306 1.163 2.408 1.523 2.749 1.694.341.17.54.142.739-.085.199-.227.852-.994 1.079-1.335.227-.341.454-.284.767-.17.312.114 1.989.938 2.33 1.108.341.17.568.256.653.398.085.142.085.824-.196 1.614z"/></svg>
      </button>
    </div>
  </div>

    <!-- LÓGICA JAVASCRIPT CORREGIDA -->
  <script>
    // --- CONFIGURACIÓN DE SUPABASE ---
    const SUPABASE_URL = 'https://ahyvmupqzgcrxrbvjzsb.supabase.co';
    
    // ⚠️ Coloca tu API Key 'anon' 'public' completa que obtienes en:
    // Supabase Dashboard -> Project Settings -> API -> Project API keys -> anon public
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFoeXZtdXBxemdjcnhyYnZqenNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MTg5MzcsImV4cCI6MjEwODA5NDkzN30.oBfYP5Pf0hXDymQtMqE2pFbWCVllRKWcYGew0iuca4Q'; 

    // Se cambia el nombre a _supabaseClient para evitar conflicto de variables
    const _supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let productos = [];
    let carrito = {};
    let ubicacionGPSUrl = '';
    let configNegocio = { 
      whatsapp_1: '', 
      whatsapp_2: '', 
      nombre: 'PERE Y EL FLACO' 
    };

    // --- INICIALIZACIÓN ---
    document.addEventListener('DOMContentLoaded', async () => {
      await cargarConfiguracion();
      await cargarProductos();
    });

    async function cargarConfiguracion() {
      try {
        const { data, error } = await _supabaseClient.from('configuracion').select('*').single();
        if (data) {
          configNegocio = data;
          if (data.nombre) {
            document.getElementById('nombre-negocio').textContent = data.nombre;
            document.title = `Menú Digital - ${data.nombre}`;
          }
        }
      } catch (err) {
        console.error("Error cargando configuración:", err);
      }
    }

    async function cargarProductos() {
      try {
        const { data, error } = await _supabaseClient.from('productos').select('*');
        if (error) {
          console.error("Error Supabase:", error);
          document.getElementById('productos-container').innerHTML = `<p class="text-center text-red-500 text-sm py-4">Error de conexión: ${error.message}</p>`;
          return;
        }
        productos = data || [];
        renderizarProductos(productos);
      } catch (err) {
        console.error("Error cargando productos:", err);
        document.getElementById('productos-container').innerHTML = '<p class="text-center text-red-500 text-sm py-4">Error al conectar con la base de datos.</p>';
      }
    }

    function renderizarProductos(lista) {
      const container = document.getElementById('productos-container');
      container.innerHTML = '';

      if (lista.length === 0) {
        container.innerHTML = '<p class="text-center text-sm text-gray-400 py-6">No hay productos disponibles.</p>';
        return;
      }

      lista.forEach(p => {
        const cant = carrito[p.id] ? carrito[p.id].cantidad : 0;
        container.innerHTML += `
          <div class="bg-white p-3 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between gap-3">
            <img src="${p.imagen_url}" alt="${p.nombre}" class="w-16 h-16 rounded-lg object-cover bg-gray-100">
            <div class="flex-1">
              <h3 class="font-bold text-sm text-gray-800">${p.nombre}</h3>
              <p class="text-xs text-gray-400 line-clamp-1">${p.descripcion || ''}</p>
              <p class="font-bold text-sm text-custom-primary mt-1">$${p.precio}</p>
            </div>
            <div class="flex items-center gap-2 bg-gray-50 p-1 rounded-lg border border-gray-200">
              <button onclick="cambiarCantidad(${p.id}, -1)" class="w-6 h-6 rounded bg-white font-bold text-gray-600 shadow-sm flex items-center justify-center">-</button>
              <span id="cant-${p.id}" class="text-xs font-bold w-4 text-center">${cant}</span>
              <button onclick="cambiarCantidad(${p.id}, 1)" class="w-6 h-6 rounded bg-custom-primary font-bold text-white shadow-sm flex items-center justify-center">+</button>
            </div>
          </div>
        `;
      });
    }

    function cambiarCantidad(id, cambio) {
      const prod = productos.find(p => p.id === id);
      if (!prod) return;

      if (!carrito[id]) {
        carrito[id] = { producto: prod, cantidad: 0 };
      }

      carrito[id].cantidad += cambio;

      if (carrito[id].cantidad <= 0) {
        delete carrito[id];
      }

      const elemCant = document.getElementById(`cant-${id}`);
      if (elemCant) elemCant.textContent = carrito[id] ? carrito[id].cantidad : 0;
      actualizarTotal();
    }

    function actualizarTotal() {
      let total = 0;
      Object.values(carrito).forEach(item => {
        total += item.producto.precio * item.cantidad;
      });
      document.getElementById('total-pedido').textContent = `$${total}`;
    }

    function toggleDireccion() {
      const tipo = document.getElementById('tipo-entrega').value;
      const campo = document.getElementById('campo-direccion');
      if (tipo === 'Retiro') {
        campo.classList.add('hidden');
      } else {
        campo.classList.remove('hidden');
      }
    }

    // --- OBTENER GEOLOCALIZACIÓN GPS ---
    function obtenerUbicacionGPS() {
      const statusElem = document.getElementById('gps-status');
      
      if (!navigator.geolocation) {
        alert("Tu navegador no soporta geolocalización.");
        return;
      }

      statusElem.textContent = "⌛ Obteniendo tu ubicación...";
      statusElem.className = "text-[11px] text-gray-500 font-medium";
      statusElem.classList.remove('hidden');

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          
          ubicacionGPSUrl = `https://maps.google.com/?q=${lat},${lng}`;
          
          statusElem.textContent = "✓ ¡Ubicación GPS capturada correctamente!";
          statusElem.className = "text-[11px] text-emerald-600 font-bold";
        },
        (error) => {
          statusElem.textContent = "❌ No se pudo obtener la ubicación. Por favor, escríbela abajo.";
          statusElem.className = "text-[11px] text-red-500 font-medium";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // --- ENVIAR A WHATSAPP ---
    function enviarPedidoWhatsApp() {
      const nombre = document.getElementById('cliente-nombre').value.trim();
      const tipoEntrega = document.getElementById('tipo-entrega').value;
      const direccion = document.getElementById('cliente-direccion').value.trim();
      const formaPago = document.getElementById('forma-pago').value;

      if (Object.keys(carrito).length === 0) {
        alert("Tu carrito está vacío. Agrega productos para realizar el pedido.");
        return;
      }

      if (!nombre) {
        alert("Por favor, ingresa tu nombre.");
        return;
      }

      if (tipoEntrega === 'Delivery' && !direccion) {
        alert("Por favor, ingresa la dirección de entrega.");
        return;
      }

      let mensaje = `*📦 NUEVO PEDIDO - ${configNegocio.nombre}*\n`;
      mensaje += `-----------------------------------\n`;
      mensaje += `👤 *Cliente:* ${nombre}\n`;
      mensaje += `🚚 *Entrega:* ${tipoEntrega}\n`;
      
      if (tipoEntrega === 'Delivery') {
        mensaje += `📍 *Dirección:* ${direccion}\n`;
        if (ubicacionGPSUrl) {
          mensaje += `🗺️ *Ubicación GPS:* ${ubicacionGPSUrl}\n`;
        }
      }

      mensaje += `💳 *Forma de Pago:* ${formaPago}\n`;
      mensaje += `-----------------------------------\n`;
      mensaje += `*DETALLE DEL PEDIDO:*\n`;

      let total = 0;
      Object.values(carrito).forEach(item => {
        const subtotal = item.producto.precio * item.cantidad;
        total += subtotal;
        mensaje += `• ${item.cantidad}x ${item.producto.nombre} - $${subtotal}\n`;
      });

      mensaje += `-----------------------------------\n`;
      mensaje += `💰 *TOTAL:* $${total}\n\n`;
      mensaje += `¡Muchas gracias!`;

      const numWhatsApp = configNegocio.whatsapp_1 || configNegocio.whatsapp_2;
      
      if (!numWhatsApp) {
        alert("No hay un número de WhatsApp configurado en el sistema.");
        return;
      }

      const urlWs = `https://wa.me/${numWhatsApp}?text=${encodeURIComponent(mensaje)}`;
      window.open(urlWs, '_blank');
    }
  </script>

</body>
</html>
